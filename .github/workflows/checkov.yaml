name: Checkov

on:
  workflow_call:
    inputs:
      skip_path:
        description: 'Paths to skip in the Checkov scan'
        required: false
        type: string
        default: ''
      soft_fail:
        description: 'If true, the job succeeds even when Checkov reports failed checks'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Check for .checkov.yaml presence
        id: check_file
        run: |
          if [ -f ".checkov.yaml" ]; then
            echo "checkov_config=true" >> "$GITHUB_OUTPUT"
          else
            echo "checkov_config=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for external checks dir presence
        id: check_external
        run: |
          if [ -d "checkov-external-checks" ]; then
            echo "external_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "external_present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Test with Checkov
        id: checkov
        uses: bridgecrewio/checkov-action@7b972723c44fb3d256283fac96fae5d7c1894bb7 # v12.3114.0
        with:
          directory: .
          framework: terraform
          external_checks_dirs: ${{ steps.check_external.outputs.external_present == 'true' && './checkov-external-checks' || '' }}
          skip_path: ${{ inputs.skip_path }}
          soft_fail: ${{ inputs.soft_fail }}
          enable_secrets_scan_all_files: true
          output_format: cli,json
          output_file_path: console,results.json
          config_file: ${{ steps.check_file.outputs.checkov_config == 'true' && '.checkov.yaml' || '' }}

