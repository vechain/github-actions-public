name: Checkov

on:
  workflow_call:
    inputs:
      skip_path:
        description: 'Paths to skip in the Checkov scan'
        required: false
        type: string
        default: ''
      soft_fail:
        description: 'If true, the job succeeds even when Checkov reports failed checks'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'

      - name: Check for .checkov.yaml presence
        id: check_file
        run: |
          if [ -f ".checkov.yaml" ]; then
            echo "checkov_config=true" >> "$GITHUB_OUTPUT"
          else
            echo "checkov_config=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Test with Checkov
        id: checkov
        uses: bridgecrewio/checkov-action@02a4c5d6a02367e5ea493c34c26b094302fd3f61 # v12.3075.0
        with:
          directory: .
          framework: terraform
          external_checks_dirs: ./checkov-external-checks
          skip_path: ${{ inputs.skip_path }}
          soft_fail: ${{ inputs.soft_fail }}
          enable_secrets_scan_all_files: true
          output_format: cli,json
          output_file_path: console,results.json
          config_file: ${{ steps.check_file.outputs.checkov_config == 'true' && '.checkov.yaml' || '' }}

